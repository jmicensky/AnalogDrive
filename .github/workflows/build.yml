name: Build

# Formal build pipeline for tester exports: builds macOS (universal, VST3 + AU
# + Standalone) and Windows (VST3 + Standalone) in Release, and uploads each
# as a downloadable zip. AAX/Pro Tools is intentionally left out of the
# Windows job for now (not part of this round of testing) even though it
# still builds fine as part of the macOS job's AnalogDrive_All target.
#
# Trigger manually from the Actions tab (workflow_dispatch) whenever you want
# a fresh tester build, or push a v* tag to cut one automatically.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  JUCE_VERSION: "8.0.12"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Clone JUCE
        run: git clone --branch "$JUCE_VERSION" --depth 1 https://github.com/juce-framework/JUCE.git juce

      - name: Configure
        run: cmake -B build -DJUCE_DIR="${{ github.workspace }}/juce" -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --target AnalogDrive_All -j4

      - name: Verify universal binary
        run: |
          set -e
          for f in \
            "build/AnalogDrive_artefacts/Release/VST3/Analog Drive.vst3/Contents/MacOS/Analog Drive" \
            "build/AnalogDrive_artefacts/Release/AU/Analog Drive.component/Contents/MacOS/Analog Drive"
          do
            archs="$(lipo -info "$f" | sed 's/.*: //')"
            echo "$f -> $archs"
            case "$archs" in
              *x86_64*arm64*|*arm64*x86_64*) ;;
              *) echo "ERROR: not universal"; exit 1 ;;
            esac
          done

      - name: Package
        run: |
          mkdir -p dist
          VERSION="$(grep -m1 -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $2}')"
          bash scripts/build_installer_macos.sh build/AnalogDrive_artefacts/Release \
            "dist/AnaDrive_Installer_1.pkg" "$VERSION"
          cp scripts/TESTER_README_macOS.txt "dist/READ ME FIRST.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: AnalogDrive-macOS
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone JUCE
        shell: cmd
        run: git clone --branch %JUCE_VERSION% --depth 1 https://github.com/juce-framework/JUCE.git juce

      - name: Configure
        shell: cmd
        run: cmake -B build -A x64 -DJUCE_DIR="%GITHUB_WORKSPACE%\juce" -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build (VST3 + Standalone only — no AAX/Pro Tools this round)
        shell: cmd
        run: cmake --build build --target AnalogDrive_VST3 AnalogDrive_Standalone --config Release

      # Testers get the installer only (VST3 -> Common Files\VST3, app ->
      # Program Files), mirroring the macOS .pkg.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item scripts\TESTER_README_Windows.txt "dist\READ ME FIRST.txt"
          choco install innosetup -y --no-progress
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DBuildDir=$env:GITHUB_WORKSPACE\build\AnalogDrive_artefacts\Release" `
            "/O$env:GITHUB_WORKSPACE\dist" `
            scripts\installer\windows\AnalogDrive.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: AnalogDrive-Windows
          path: dist
